services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackorder
      POSTGRES_PASSWORD: trackorder
      POSTGRES_DB: trackorder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
